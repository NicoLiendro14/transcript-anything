<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Teams Captions</h1>
      <span id="status" class="status waiting">Esperando captions...</span>
    </div>

    <div id="transcript" class="transcript"></div>

    <div class="actions">
      <button id="btn-export-txt">Export TXT</button>
      <button id="btn-export-md">Export MD</button>
      <button id="btn-export-json">Export JSON</button>
      <button id="btn-clear" class="danger">Limpiar</button>
    </div>

    <div class="stats">
      <span id="line-count">0 líneas</span>
      <span id="speaker-count">0 speakers</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
